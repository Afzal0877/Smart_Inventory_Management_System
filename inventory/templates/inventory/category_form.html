{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Add Category</h2>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">

        <label class="form-label">
            Category Name
        </label>

        <input
            type="text"
            name="name"
            class="form-control"
            required
        >

    </div>

    <div class="mb-3">

        <label class="form-label">
            Description
        </label>

        <textarea
            name="description"
            class="form-control"
            rows="4"
        ></textarea>

    </div>

    <button
        type="submit"
        class="btn btn-success"
    >
        Save Category
    </button>

</form>

{% endblock %}
