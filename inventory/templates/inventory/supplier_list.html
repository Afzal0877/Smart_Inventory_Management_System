{% extends 'base.html' %}

{% block content %}

<h2>Suppliers</h2>

<a href="{% url 'add_supplier' %}" class="btn btn-primary mb-3">
    Add Supplier
</a>

<table class="table table-bordered">

    <thead class="table-dark">
    <tr>
        <th>Name</th>
        <th>Phone</th>
    </tr>
</thead>
    <tbody>

    {% for supplier in suppliers %}

        <tr>
    <td>{{ supplier.name }}</td>
    <td>{{ supplier.phone }}</td>
</tr>

    {% empty %}

        <tr>
            <td colspan="2" class="text-center">
                No Suppliers Found
            </td>
        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
